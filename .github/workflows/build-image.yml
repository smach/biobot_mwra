name: Build container image

# Builds the pinned runtime image used by check-data.yml and pushes it to the
# GitHub Container Registry. Runs only when the Dockerfile (or this workflow)
# changes, so it is not part of the twice-daily data-check cost.
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
