name: Check MWRA Biobot Data

on:
  # Run twice daily at 13:48 and 21:48 UTC
  schedule:
    - cron: '48 13,21 * * *'

  # Allow manual trigger
  workflow_dispatch:

  # Run on push to main for testing
  push:
    branches: [main]
    paths:
      - 'R/**'
      - '.github/workflows/check-data.yml'
      - 'run_monitor.R'
      - 'docs/**'

jobs:
  check-data:
    runs-on: ubuntu-latest

    # Run inside the pinned image built by build-image.yml. R, all packages,
    # and curl-impersonate are baked in, so there is no per-run package install
    # (which is what used to fail intermittently with the rlang ABI mismatch).
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      contents: write
      issues: write
      pages: write
      id-token: write
      packages: read

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run data check
        id: check
        run: Rscript run_monitor.R

      - name: Commit and push changes
        if: steps.check.outputs.data_updated == 'true'
        run: |
          # Running as root inside the container, the checkout is owned by a
          # different uid, so mark the workspace safe before touching git.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ output/ state/ docs/
          git diff --staged --quiet || git commit -m "Update MWRA Biobot data (${{ steps.check.outputs.sample_date }})"
          git push

      - name: Create notification issue
        if: steps.check.outputs.data_updated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const sampleDate = '${{ steps.check.outputs.sample_date }}';
            const repoUrl = 'https://github.com/' + context.repo.owner + '/' + context.repo.repo;
            const pagesUrl = 'https://' + context.repo.owner + '.github.io/' + context.repo.repo;

            const body = '## New Wastewater Data Available\n\n' +
              '**Sample collection date:** ' + sampleDate + '\n\n' +
              '### Interactive Dashboard\n\n' +
              '**[View Interactive Charts](' + pagesUrl + ')** - Explore the data with customizable date ranges and options.\n\n' +
              '### Static Plots\n\n' +
              '- [North System 90-day plot](' + repoUrl + '/blob/main/output/plots/north_90days.png)\n' +
              '- [South System 90-day plot](' + repoUrl + '/blob/main/output/plots/south_90days.png)\n\n' +
              '### Data Files\n\n' +
              '- [Combined CSV](' + repoUrl + '/blob/main/data/processed/combined_data.csv)\n' +
              '- [North System CSV](' + repoUrl + '/blob/main/data/processed/north_system.csv)\n' +
              '- [South System CSV](' + repoUrl + '/blob/main/data/processed/south_system.csv)\n\n' +
              '---\n' +
              '*This issue was automatically created by the MWRA Biobot Data Monitor.*';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'MWRA Biobot Data Updated - ' + sampleDate,
              body: body,
              labels: ['data-update', 'automated']
            });

      # MWRA sometimes pauses publishing for weeks. Say so once, rather than
      # failing twice a day or staying silent (which is what used to happen).
      - name: Report stalled MWRA publishing
        if: steps.check.outputs.data_stale == 'true'
        uses: actions/github-script@v7
        env:
          STALE_DAYS: ${{ steps.check.outputs.stale_days }}
        with:
          script: |
            const staleDays = process.env.STALE_DAYS;
            const label = 'stale-data';

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label
            });

            if (existing.data.length > 0) {
              core.info('Stale-data issue already open; not filing another.');
              return;
            }

            const pagesUrl = 'https://' + context.repo.owner + '.github.io/' + context.repo.repo;
            const body = '## MWRA Biobot data has stalled\n\n' +
              'The MWRA Biobot page still loads, but the newest published sample is **' +
              staleDays + ' days old**.\n\n' +
              'The scraper is working — MWRA simply has not posted new data. ' +
              'Nothing to fix here unless this goes on much longer.\n\n' +
              'In the meantime, the [WastewaterSCAN pipeline](' + pagesUrl + ') covers the same ' +
              'Deer Island sewershed and updates every few days.\n\n' +
              '*Close this issue once MWRA resumes; it will not be refiled while it stays open.*';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'MWRA Biobot data stalled — ' + staleDays + ' days without an update',
              body: body,
              labels: [label, 'automated']
            });

      - name: Upload plots artifact
        if: steps.check.outputs.data_updated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: plots-${{ steps.check.outputs.sample_date }}
          path: output/plots/
          retention-days: 30

  # Deploy to GitHub Pages (runs after check-data or on docs changes)
  deploy-pages:
    needs: check-data
    if: always() && needs.check-data.result != 'failure'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    # Shared with check-wwscan.yml so the two workflows never deploy at once.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main  # Get latest including any commits from check-data job

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
